{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Contact</title>

    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}"
    >

</head>

<body>

<div class="container small-container">

    <div class="header">

        <div>
            <h1>✏️ Edit Contact</h1>
            <p>Update contact information</p>
        </div>

        <a href="{% url 'index' %}" class="back-btn">
            ← Back
        </a>

    </div>


    <div class="card">

        <form
            method="POST"
            action="{% url 'formupdate' Data.id %}"
        >

            {% csrf_token %}


            <div class="form-row">

                <div class="form-group">

                    <label>First Name</label>

                    <input
                        type="text"
                        name="firstname"
                        value="{{ Data.FirstName }}"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Last Name</label>

                    <input
                        type="text"
                        name="lastname"
                        value="{{ Data.LastName }}"
                        required
                    >

                </div>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label>Email</label>

                    <input
                        type="email"
                        name="email"
                        value="{{ Data.Email }}"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Phone Number</label>

                    <input
                        type="text"
                        name="phone"
                        value="{{ Data.ContactNumber }}"
                        required
                    >

                </div>

            </div>


            <div class="button-group">

                <a
                    href="{% url 'index' %}"
                    class="btn-cancel"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="btn-primary"
                >
                    Update Contact
                </button>

            </div>

        </form>

    </div>

</div>

</body>
</html>
